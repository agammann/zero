[package]
name = "oneway-vault"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Explicit AES-256-GCM processing and selected-file cleanup for Windows"

[dependencies]
aes-gcm = "=0.11.1"
getrandom = "=0.4.3"
sha2 = "=0.10.9"
zeroize = "=1.9.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

