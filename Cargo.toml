[package]
name = "zero"
version = "0.5.0"
edition = "2024"
license = "MIT"
description = "Encrypted on-disk processing and selected-file cleanup for Windows"

[dependencies]
aes-gcm = { version = "=0.11.1", features = ["zeroize"] }
getrandom = "=0.4.3"
sha2 = "=0.10.9"
zeroize = "=1.9.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
ed25519-dalek = "=2.2.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

