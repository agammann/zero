name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup update stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test --locked
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build executable
        shell: pwsh
        run: .\build-windows.ps1
      - name: Whole-volume command stays disabled
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'zero-volume-guard'
          New-Item -ItemType Directory -Path $testRoot -Force | Out-Null
          $sentinel = Join-Path $testRoot 'keep.txt'
          Set-Content -LiteralPath $sentinel -Value 'keep'
          & .\Zero.exe --quiet --volume $testRoot
          if ($LASTEXITCODE -ne 1) { throw 'The retired command did not fail.' }
          if ((Get-Content -LiteralPath $sentinel -Raw).Trim() -ne 'keep') { throw 'The sentinel changed.' }
      - name: Package archives
        shell: pwsh
        run: .\package-release.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ.' }
          $escapedVersion = [regex]::Escape($version)
          $section = [regex]::Match((Get-Content .\CHANGELOG.md -Raw), "(?ms)^## $escapedVersion[ \t]*\r?\n(.*?)(?=^## |\z)")
          if (-not $section.Success) { throw 'Release notes for the package version are missing.' }
          $notesPath = Join-Path $env:RUNNER_TEMP 'zero-release-notes.md'
          Set-Content -LiteralPath $notesPath -Value $section.Groups[1].Value.Trim() -Encoding utf8NoBOM
          gh release create $env:GITHUB_REF_NAME .\Zero.exe ".\dist\Zero-$version-Windows.zip" ".\dist\Zero-$version-Source.zip" --title "Zero $version" --notes-file $notesPath --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
