name: Windows build and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup update stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test --locked
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build
        run: cargo build --release --locked
      - name: Whole-volume command stays disabled
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'zero-volume-guard'
          New-Item -ItemType Directory -Path $testRoot -Force | Out-Null
          $sentinel = Join-Path $testRoot 'keep.txt'
          Set-Content -LiteralPath $sentinel -Value 'keep'
          & .\target\release\zero.exe --quiet --volume $testRoot
          if ($LASTEXITCODE -ne 1) { throw 'The retired command did not fail.' }
          if ((Get-Content -LiteralPath $sentinel -Raw).Trim() -ne 'keep') { throw 'The sentinel changed.' }
