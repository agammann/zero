name: Windows build and tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: zero-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-2025
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install pinned Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
          rustup override set 1.98.1
          if ($LASTEXITCODE -ne 0) { throw 'Rust selection failed.' }
      - name: Build and check exact source
        shell: pwsh
        run: .\build-windows.ps1
      - name: Verify disposable core journey
        shell: pwsh
        run: .\scripts\verify-core.ps1 -Executable .\build\Zero.exe -OutputDirectory "$env:RUNNER_TEMP/zero-core"
      - name: Package and extract fresh consumers
        shell: pwsh
        run: |
          .\package-release.ps1
          .\scripts\check-release.ps1 -Directory .\release-artifacts -ExtractTo "$env:RUNNER_TEMP/zero-consumer"
          $version = (Get-Content .\Cargo.toml | Select-String '^version = "(.*)"').Matches.Groups[1].Value
          & "$env:RUNNER_TEMP/zero-consumer/source/Zero-$version-Source/build-windows.ps1"
      - name: Verify delivered Windows executable
        shell: pwsh
        run: |
          $version = (Get-Content .\Cargo.toml | Select-String '^version = "(.*)"').Matches.Groups[1].Value
          .\scripts\verify-core.ps1 -Executable "$env:RUNNER_TEMP/zero-consumer/windows/Zero-$version/Zero.exe" -OutputDirectory "$env:RUNNER_TEMP/zero-delivered-core"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: zero-release-${{ github.sha }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
