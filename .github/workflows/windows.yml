name: Windows build and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup update stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test --locked
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build
        run: cargo build --release --locked
      - name: Whole-volume command stays disabled
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'zero-volume-guard'
          New-Item -ItemType Directory -Path $testRoot -Force | Out-Null
          $sentinel = Join-Path $testRoot 'keep.txt'
          Set-Content -LiteralPath $sentinel -Value 'keep'
          $process = Start-Process -FilePath .\target\release\zero.exe -ArgumentList "--quiet --volume `"$testRoot`"" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 1) { throw "The retired command exited with $($process.ExitCode), expected 1." }
          $errorPath = Join-Path $env:LOCALAPPDATA 'Zero\last-error.txt'
          if ((Get-Content -LiteralPath $errorPath -Raw) -notmatch 'whole-volume selection is not supported') { throw 'The expected scope error was not recorded.' }
          if ((Get-Content -LiteralPath $sentinel -Raw).Trim() -ne 'keep') { throw 'The sentinel changed.' }
