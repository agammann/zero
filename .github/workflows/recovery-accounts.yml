name: Recovery account isolation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  recovery-accounts:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
      - name: Check and build test-only fixture driver
        id: build
        shell: pwsh
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust formatting failed.' }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed.' }
          $messages = cargo test --locked --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) { throw 'Fixture build failed.' }
          $artifacts = @($messages | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.profile.test -and $_.executable })
          if ($artifacts.Count -ne 1) { throw 'Expected one exact-source Rust test executable.' }
          "executable=$($artifacts[0].executable)" >> $env:GITHUB_OUTPUT
      - name: Verify independent Windows accounts and owner recovery
        shell: pwsh
        env:
          ZERO_TEST_EXECUTABLE: ${{ steps.build.outputs.executable }}
        run: ./scripts/verify-recovery-accounts.ps1 -TestExecutable $env:ZERO_TEST_EXECUTABLE
